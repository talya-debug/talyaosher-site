<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="רומי, העוזרת הדיגיטלית">
  <!-- אווטר מאויר של רומי — שיער חום-בלונד, בלייזר כחול כהה, חיוך -->
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a2e"/>
      <stop offset=".4" stop-color="#a86b3c"/>
      <stop offset=".7" stop-color="#d9a95e"/>
      <stop offset="1" stop-color="#e8bf72"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf1d6"/>
      <stop offset="1" stop-color="#f7dca0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- שיער מאחור -->
    <path d="M52 92 C48 50 72 30 100 30 C130 30 154 50 150 94 C150 112 156 124 150 134 C160 142 150 152 158 162 C166 172 156 180 164 190 L150 200 L50 200 L36 190 C44 180 34 172 42 162 C50 152 40 142 50 134 C44 124 52 112 52 92 Z" fill="url(#hair)"/>
    <!-- קווי גלים עדינים בשיער -->
    <path d="M58 128 C52 138 62 146 56 156 C50 166 60 172 54 182" stroke="#c9914c" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M142 128 C148 138 138 146 144 156 C150 166 140 172 146 182" stroke="#c9914c" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".7"/>
    <!-- צוואר -->
    <path d="M86 118 L114 118 L116 150 L84 150 Z" fill="#eab796"/>
    <!-- חולצה + בלייזר -->
    <path d="M36 200 C38 168 58 150 84 144 L100 170 L116 144 C142 150 162 168 164 200 Z" fill="#1d2a3b"/>
    <path d="M84 144 L100 170 L116 144 L110 142 L100 158 L90 142 Z" fill="#2c3e57"/>
    <path d="M58 200 C60 178 70 160 84 150 L96 178 L88 200 Z" fill="#162232"/>
    <path d="M142 200 C140 178 130 160 116 150 L104 178 L112 200 Z" fill="#162232"/>
    <!-- פנים -->
    <ellipse cx="100" cy="90" rx="33" ry="39" fill="#f3c9a9"/>
    <!-- אוזניים ועגילים -->
    <ellipse cx="67" cy="94" rx="5" ry="8" fill="#eab796"/>
    <ellipse cx="133" cy="94" rx="5" ry="8" fill="#eab796"/>
    <circle cx="133" cy="106" r="2.6" fill="#d9a441"/>
    <circle cx="67" cy="106" r="2.6" fill="#d9a441"/>
    <!-- שיער מלפנים, שביל בצד -->
    <path d="M66 92 C62 58 82 44 104 46 C124 47 138 62 136 92 C132 72 122 60 108 58 C94 70 80 76 66 92 Z" fill="#8a5431"/>
    <path d="M66 92 C64 112 60 132 54 150 C50 128 54 104 66 92 Z" fill="url(#hair)"/>
    <path d="M136 92 C138 112 142 132 148 150 C152 128 148 104 136 92 Z" fill="url(#hair)"/>
    <!-- גבות -->
    <path d="M80 78 Q88 74 95 77" stroke="#8a5431" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M105 77 Q112 74 120 78" stroke="#8a5431" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- עיניים -->
    <ellipse cx="88" cy="88" rx="3.4" ry="4" fill="#2a3b44"/>
    <ellipse cx="112" cy="88" rx="3.4" ry="4" fill="#2a3b44"/>
    <circle cx="89.2" cy="86.6" r="1.1" fill="#fff"/>
    <circle cx="113.2" cy="86.6" r="1.1" fill="#fff"/>
    <!-- לחיים -->
    <ellipse cx="80" cy="101" rx="6" ry="3.6" fill="#ec9f86" opacity=".45"/>
    <ellipse cx="120" cy="101" rx="6" ry="3.6" fill="#ec9f86" opacity=".45"/>
    <!-- אף -->
    <path d="M100 92 Q98 100 101 103" stroke="#d99b7c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- חיוך -->
    <path d="M86 108 Q100 122 114 108 Q100 114 86 108 Z" fill="#b8444f"/>
    <path d="M88 108.6 Q100 113.4 112 108.6 L111 111 Q100 115 89 111 Z" fill="#fff"/>
  </g>
</svg>
